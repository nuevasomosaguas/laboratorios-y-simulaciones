name: Probar los problemas

# En cada problema, la solución tiene que pasar su comprobación y los errores de pruebas.R, fallar.
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript probar.R
